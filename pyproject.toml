[project]
name = "spectra-conc"
version = "0.1.0"
description = "Регрессия концентрации вещества в жидкости по оптическим спектрам"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "scikit-learn>=1.6",
    "matplotlib",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest",
    "ruff>=0.17.6",
]
nn = ["torch", "tabpfn"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spectra"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Нейросети (CPU): uv sync --group nn; запуск: uv run --group nn ...
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
